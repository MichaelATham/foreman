[project]
name = "foreman-cad"
version = "0.1.0"
description = "Foreman: a self-verifying AI CAD agent on NVIDIA SMLib / USD BRep"
requires-python = "==3.12.*"
dependencies = [
    "usd-brep==1.0.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "numpy>=1.26",
    "pillow>=10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
foreman = "foreman.cli:main"
foreman-server = "foreman.server.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foreman*"]

[tool.setuptools.package-data]
"foreman.server" = ["static/*", "static/vendor/*"]
